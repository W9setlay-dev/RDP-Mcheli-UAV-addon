buildscript {
    repositories {
        flatDir {
            dirs 'libs'
        }
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
    }

    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'

version = '0.1.0'
group = 'net.vas.rdp.uav'
archivesBaseName = 'rdp-uav-addon'
def forgeVersion = '1.12.2-14.23.5.2859'

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    runs {
        client {
            workingDirectory project.file(System.getenv('RDP_UAV_RUN_DIR') ?: 'run')
            property 'fml.coreMods.load', 'com.norwood.mcheli.core.MCHCore,zone.rong.mixinbooter.MixinBooterPlugin,com.cleanroommc.modularui.core.ModularUICore,net.vas.rdp.uav.core.RdpUavCorePlugin'
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }

    maven {
        name = 'forge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'cleanroom'
        url = 'https://maven.cleanroommc.com'
    }
}

def mcheliJar = file(System.getenv('RDP_MCHELI_JAR') ?: 'libs/mcheli-ce-1.5.1.jar')
def rdpCoreJar = file(System.getenv('RDP_CORE_JAR') ?: 'libs/rdpcore-1.0.0.jar')
def elegantNetworkingJar = file('libs/elegant-networking-1.12-3.17.jar')
def mcheliAccessTransformer = file("$buildDir/generated/mcheli/META-INF/mcheli_at.cfg")

configurations {
    forgeRunSide
}

tasks.register('extractMcheliAccessTransformer', Copy) {
    from zipTree(mcheliJar)
    include 'META-INF/mcheli_at.cfg'
    into mcheliAccessTransformer.parentFile.parentFile
}

dependencies {
    minecraft "net.minecraftforge:forge:${forgeVersion}"
    forgeRunSide "net.minecraftforge:forge:${forgeVersion}:universal"
    // Keep required McHeli runtime mods on the client launch classpath.
    compile files(elegantNetworkingJar, rdpCoreJar)
    compile fg.deobf('blank:mcheli-ce:1.5.1')

    compile('com.cleanroommc:modularui:3.0.5') {
        transitive = false
    }
    runtimeOnly('zone.rong:mixinbooter:11.17') {
        transitive = false
    }
    testCompile 'junit:junit:4.13.2'
}

tasks.register('forgeRunSideJar', Jar) {
    // The mapped dev jar exposes an extra Side.BUKKIT value, but FML channel maps
    // only initialize CLIENT and SERVER. Use Forge's universal enum in dev runs/tests.
    from {
        zipTree(configurations.forgeRunSide.singleFile)
    }
    include 'net/minecraftforge/fml/relauncher/Side.class'
    archiveName = 'forge-run-side.jar'
    destinationDir = file("$buildDir/fg_run")
}

tasks.configureEach { task ->
    if (task.name == 'runClient') {
        task.dependsOn forgeRunSideJar
        task.classpath = files(forgeRunSideJar.archivePath) + task.classpath
        task.doFirst {
            task.main = 'net.vas.rdp.uav.dev.LegacyDevClientLauncher'
        }
    }
}

test {
    dependsOn forgeRunSideJar
    classpath = files(forgeRunSideJar.archivePath) + classpath
}

minecraft.accessTransformer mcheliAccessTransformer
compileJava.dependsOn 'extractMcheliAccessTransformer'

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}

jar {
    exclude 'net/vas/rdp/uav/dev/LegacyDevClientLauncher.class'
    manifest {
        attributes(
                'FMLCorePlugin': 'net.vas.rdp.uav.core.RdpUavCorePlugin',
                'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}
